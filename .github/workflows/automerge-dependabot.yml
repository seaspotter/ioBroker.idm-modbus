# Workflow for auto-merging Dependabot PRs
# This workflow uses the action-automerge-dependabot action to automatically merge
# Dependabot PRs based on the rules defined in .github/auto-merge.yml

name: Auto-Merge Dependabot PRs

on:
    # Trigger when a PR is opened or updated. `pull_request` is enough: PRs created by Dependabot run it with write access, and
    # `pull_request_target` (which GitHub restricts for public repositories from 2026-11-02) is not needed
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        # Only run if actor is dependabot
        if: github.actor == 'dependabot[bot]'

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Auto-merge Dependabot PRs
              uses: iobroker-bot-orga/action-automerge-dependabot@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
